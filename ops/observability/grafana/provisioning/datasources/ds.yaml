apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: epoch-prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    type: loki
    uid: epoch-loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - name: game_id
          matcherRegex: '"game\.id":"([^"]+)"'
          url: ""
          datasourceUid: epoch-loki
